<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010204"/>
      <stop offset="55%" stop-color="#06121c"/>
      <stop offset="100%" stop-color="#0d2733"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8feaff"/>
      <stop offset="100%" stop-color="#1fc9ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2fd0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2fd0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="600" cy="140" r="260" fill="url(#glow)"/>

  <!-- glass chessboard grid, subtle -->
  <g opacity="0.5">
    <g fill="#0f2733">
      <rect x="380" y="220" width="35" height="35"/>
      <rect x="450" y="220" width="35" height="35"/>
      <rect x="520" y="220" width="35" height="35"/>
      <rect x="590" y="220" width="35" height="35"/>
      <rect x="660" y="220" width="35" height="35"/>
      <rect x="730" y="220" width="35" height="35"/>
      <rect x="800" y="220" width="35" height="35"/>
    </g>
    <g fill="#173445">
      <rect x="415" y="220" width="35" height="35"/>
      <rect x="485" y="220" width="35" height="35"/>
      <rect x="555" y="220" width="35" height="35"/>
      <rect x="625" y="220" width="35" height="35"/>
      <rect x="695" y="220" width="35" height="35"/>
      <rect x="765" y="220" width="35" height="35"/>
    </g>
  </g>

  <!-- glass knight silhouette -->
  <path d="M560 210 L560 130 Q555 95 585 80 Q615 65 630 95 L645 120 L625 128 L635 145 L600 150 L600 210 Z"
        fill="#c4f1ff" fill-opacity="0.18" stroke="#8feaff" stroke-width="2" stroke-opacity="0.6"/>

  <text x="600" y="118" font-family="'Cinzel', Georgia, serif" font-size="70" font-weight="700" fill="url(#title)" text-anchor="middle" letter-spacing="3">GLASS GAMBIT</text>
  <text x="600" y="155" font-family="Georgia, serif" font-size="24" fill="#a9b6c4" text-anchor="middle" letter-spacing="4">GLASSMORPHIC 3D CHESS WITH AI</text>
  <text x="600" y="270" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5d6b7a" text-anchor="middle">Ten ranks of opponent, from Novice to Immortal</text>
</svg>
